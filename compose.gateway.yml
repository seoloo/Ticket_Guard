# 팀 입구 · 관리자 로그인 → QA 대시보드 · compose.yml에 덧붙여 실행
# docker compose -f compose.yml -f compose.gateway.yml up -d --build
# 밖으로 열린 포트는 gateway의 127.0.0.1:8000 하나 · web · qa-dashboard는 안쪽 네트워크로만
services:
  web:
    ports: !reset []
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web  # qa-dashboard가 http://web:8000으로 접속
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}

  qa-dashboard:
    image: ticket-guard-qa:dev
    build: ${TICKET_GUARD_QA_DIR:-./qa}
    environment:
      TICKET_GUARD_QA_DASHBOARD_BASE_PATH: /qa
      TICKET_GUARD_QA_SYSTEM_BASE_URL: http://web:8000
      TICKET_GUARD_QA_SYSTEM_USERNAME: ${DEMO_USERNAME:-ticketguard}
      TICKET_GUARD_QA_SYSTEM_PASSWORD: ${DEMO_PASSWORD:-ticketguard-demo}
      # Read-only system MongoDB URI; keep credentials in the ignored local .env.
      TICKET_GUARD_QA_SYSTEM_MONGO_URI: ${TICKET_GUARD_QA_SYSTEM_MONGO_URI:-}
      # web 테스트 훅과 같은 값 · .env 한 곳에서 (Issue #6)
      TICKET_GUARD_QA_TEST_ACCOUNT_COUNT: ${QA_TEST_ACCOUNT_COUNT:-0}
      TICKET_GUARD_QA_TEST_ACCOUNT_PASSWORD: ${QA_TEST_ACCOUNT_PASSWORD:-}
      TICKET_GUARD_QA_CAPTCHA_FIXED_ANSWER: ${QA_CAPTCHA_FIXED_ANSWER:-}
      TICKET_GUARD_QA_QA_DATABASE_URL: sqlite:////qa/qa_data/qa.db
      TICKET_GUARD_QA_REPORT_OUTPUT_DIR: /qa/qa_data/reports
    volumes:
      - qa-data:/qa/qa_data
    depends_on:
      web:
        condition: service_healthy

  admin-dashboard:
    image: ticket-guard-qa:dev
    build: ${TICKET_GUARD_QA_DIR:-./qa}
    command: ["ticket-guard-qa", "admin-dashboard"]
    environment:
      TICKET_GUARD_QA_ADMIN_DASHBOARD_BASE_PATH: /admin-dashboard
      TICKET_GUARD_QA_SYSTEM_MONGO_URI: ${TICKET_GUARD_QA_SYSTEM_MONGO_URI:-}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - mongo-backend

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${TICKET_GUARD_GATEWAY_PORT:-8000}:8000"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      qa-dashboard:
        condition: service_started
      admin-dashboard:
        condition: service_started

volumes:
  qa-data:
