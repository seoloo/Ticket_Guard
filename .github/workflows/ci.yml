# [홍석환] 웹 애플리케이션 지속 통합 검사
# 변경 사항에 대해 의존성 설치와 자동 검증 작업을 수행한다.
name: Django phase 1
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  django:
    env:
      EVENT_PUBLISHER: mock
    runs-on: ubuntu-latest
    container: python:3.13.15-slim-trixie
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r requirements.txt
      - run: python --version
      - run: python manage.py check
      - run: python manage.py test web -v 2
