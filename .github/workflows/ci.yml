name: Django phase 1
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    container: python:3.13.15-slim-trixie
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r requirements.txt
      - run: python --version
      - run: python manage.py check
      - run: python manage.py test web -v 2
