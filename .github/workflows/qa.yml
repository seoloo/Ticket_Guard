name: QA

on:
  push:
    paths: ["qa/**", ".github/workflows/qa.yml"]
  pull_request:
    paths: ["qa/**", ".github/workflows/qa.yml"]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    container: python:3.13.15-slim-trixie
    # QA DB = 메모리 MongoDB(mongomock) · 실행 서버 커널 7.0에서 mongo:8.0.x가 시작을 거부함(SERVER-121912)
    # 실제 MongoDB 접속 확인은 Live 컨테이너 검증에서 해요
    defaults:
      run:
        working-directory: qa
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -e ".[dashboard,dev]"
      - run: python -m pytest -v
      - run: ticket-guard-qa run --suite self_check --suite event_contract --target fake
        env:
          TICKET_GUARD_QA_QA_DATABASE_URL: mongomock://ticketguard_qa
