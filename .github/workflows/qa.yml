name: QA

on:
  push:
    paths: ["qa/**", ".github/workflows/qa.yml"]
  pull_request:
    paths: ["qa/**", ".github/workflows/qa.yml"]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    container: python:3.13.15-slim-trixie
    # CI 전용 일회용 QA DB · 팀 이미지와 같은 버전 · 작업 끝나면 삭제 · 인증 없음
    services:
      qa-mongo:
        image: mongo:8.0.34
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: qa
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -e ".[dashboard,dev]"
      - run: python -m pytest -v
      - run: ticket-guard-qa run --suite self_check --suite event_contract --target fake
        env:
          TICKET_GUARD_QA_QA_DATABASE_URL: mongodb://qa-mongo:27017/ticketguard_qa
