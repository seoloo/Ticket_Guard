name: ticket-guard

services:
  web:
    image: ticket-guard-web:dev
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-demo-only-change-before-deployment-ticket-guard}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DEMO_USERNAME: ${DEMO_USERNAME:-ticketguard}
      DEMO_SECOND_USERNAME: ${DEMO_SECOND_USERNAME:-guest}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-ticketguard-demo}
      SHOW_SCENARIOS: ${SHOW_SCENARIOS:-1}
      # QA 테스트 훅 · 기본값은 꺼짐 (Issue #6)
      QUEUE_WAIT_SECONDS: ${QUEUE_WAIT_SECONDS:-12}
      QA_TEST_ACCOUNT_COUNT: ${QA_TEST_ACCOUNT_COUNT:-0}
      QA_TEST_ACCOUNT_PASSWORD: ${QA_TEST_ACCOUNT_PASSWORD:-}
      QA_CAPTCHA_FIXED_ANSWER: ${QA_CAPTCHA_FIXED_ANSWER:-}
      QA_RESET_ENABLED: ${QA_RESET_ENABLED:-0}
      PYTHONUNBUFFERED: "1"
      EVENT_PUBLISHER: ${EVENT_PUBLISHER:-kafka}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:-ticketguard.events.v1}
      KAFKA_CLIENT_ID: ticketguard-web
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000", "--noreload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    init: true
    stdin_open: true
    tty: true

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

  kafka-init:
    image: ticket-guard-web:dev
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:-ticketguard.events.v1}
      KAFKA_RETENTION_MS: ${KAFKA_RETENTION_MS:-604800000}
      KAFKA_RETENTION_BYTES: ${KAFKA_RETENTION_BYTES:-268435456}
    command: ["python", "manage.py", "init_kafka"]
    depends_on:
      kafka:
        condition: service_healthy

  # Use -p ticket-guard-workspace-db for MongoDB commands; see docs/mongodb.md.
  mongo:
    image: mongo:8.0.34
    profiles: [mongo]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-ticketguard}
      MONGO_WRITER_USERNAME: ${MONGO_WRITER_USERNAME:-}
      MONGO_WRITER_PASSWORD: ${MONGO_WRITER_PASSWORD:-}
    entrypoint: ["bash", "/opt/mongo/start.sh"]
    command: ["mongod", "--auth", "--bind_ip_all"]
    networks:
      - mongo-backend
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./mongo/start.sh:/opt/mongo/start.sh:ro
      - ./mongo/init.js:/docker-entrypoint-initdb.d/10-ticketguard.js:ro
      - ./mongo/healthcheck.js:/opt/mongo/healthcheck.js:ro
      - ./mongo/verify.js:/opt/mongo/verify.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--norc", "/opt/mongo/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s

  # Run Spark with -p ticket-guard-workspace-pipeline; existing services are external.
  spark:
    image: ticket-guard-workspace-spark:dev
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    profiles: [spark]
    environment:
      SPARK_KAFKA_BOOTSTRAP_SERVERS: ${SPARK_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:-ticketguard.events.v1}
      SPARK_MONGO_HOST: ${SPARK_MONGO_HOST:-ticket-guard-workspace-db-mongo-1}
      SPARK_MONGO_PORT: ${SPARK_MONGO_PORT:-27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-ticketguard}
      MONGO_WRITER_USERNAME: ${MONGO_WRITER_USERNAME:-}
      MONGO_WRITER_PASSWORD: ${MONGO_WRITER_PASSWORD:-}
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR:-/checkpoints/events}
      SPARK_TRIGGER_SECONDS: ${SPARK_TRIGGER_SECONDS:-5}
      SPARK_MAX_OFFSETS_PER_TRIGGER: ${SPARK_MAX_OFFSETS_PER_TRIGGER:-1000}
      SPARK_MONGO_BULK_SIZE: ${SPARK_MONGO_BULK_SIZE:-200}
      SPARK_MONGO_TIMEOUT_MS: ${SPARK_MONGO_TIMEOUT_MS:-10000}
      SPARK_MONGO_WRITE_ATTEMPTS: ${SPARK_MONGO_WRITE_ATTEMPTS:-3}
    networks:
      - spark-kafka
      - spark-mongo
    volumes:
      - spark-checkpoints:/checkpoints
    command: [ingest]
    init: true
    restart: "no"
    stop_grace_period: 60s

volumes:
  kafka-data:
  mongo-data:
  mongo-config:
  spark-checkpoints:

networks:
  mongo-backend:
  spark-kafka:
    external: true
    name: ${SPARK_KAFKA_NETWORK:-ticket-guard_default}
  spark-mongo:
    external: true
    name: ${SPARK_MONGO_NETWORK:-ticket-guard-workspace-db_mongo-backend}
