name: ticket-guard

services:
  web:
    image: ticket-guard-web:dev
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-demo-only-change-before-deployment-ticket-guard}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DEMO_USERNAME: ${DEMO_USERNAME:-ticketguard}
      DEMO_SECOND_USERNAME: ${DEMO_SECOND_USERNAME:-guest}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-ticketguard-demo}
      SHOW_SCENARIOS: ${SHOW_SCENARIOS:-1}
      PYTHONUNBUFFERED: "1"
      EVENT_PUBLISHER: ${EVENT_PUBLISHER:-kafka}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:-ticketguard.events.v1}
      KAFKA_CLIENT_ID: ticketguard-web
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000", "--noreload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    init: true
    stdin_open: true
    tty: true

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

  kafka-init:
    image: ticket-guard-web:dev
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:-ticketguard.events.v1}
      KAFKA_RETENTION_MS: ${KAFKA_RETENTION_MS:-604800000}
      KAFKA_RETENTION_BYTES: ${KAFKA_RETENTION_BYTES:-268435456}
    command: ["python", "manage.py", "init_kafka"]
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
