[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-guard-admin"
version = "0.1.0"
description = "TicketGuard 관리자 DB 대시보드 · 독립 읽기 전용 앱"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "jinja2==3.1.5",
    "pydantic-settings==2.6.1",
    "pymongo==4.10.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "mongomock==4.3.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ticket_guard_admin = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
