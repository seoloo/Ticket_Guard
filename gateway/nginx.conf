# 팀 입구 · 밖으로 열린 유일한 포트 8000 · /는 Django, /qa/는 관리자만 QA 대시보드
server {
    listen 8000;
    absolute_redirect off;  # 302 /login/을 접속한 주소 그대로
    resolver 127.0.0.11 valid=10s;  # Docker DNS · 컨테이너를 다시 띄워도 새 주소로
    set $web_upstream web:8000;
    set $qa_upstream qa-dashboard:8000;

    location = /qa {
        return 301 /qa/;
    }

    location /qa/ {
        auth_request /_check_admin;  # Django에 "관리자 맞아?"
        auth_request_set $admin_user $upstream_http_x_admin_user;
        error_page 401 = @go_login;

        proxy_set_header X-Admin-User $admin_user;  # 브라우저가 보낸 같은 헤더는 덮어씀
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;  # 03 실행 화면 진행 메시지
        proxy_read_timeout 1h;
        rewrite ^/qa/(.*)$ /$1 break;  # /qa 떼고 전달
        proxy_pass http://$qa_upstream;
    }

    location = /_check_admin {
        internal;
        proxy_pass http://$web_upstream/auth/check-admin/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
    }

    location @go_login {
        return 302 /login/;
    }

    location / {
        proxy_set_header Host $http_host;  # 포트 포함 · Django CSRF Origin 확인과 맞춤
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://$web_upstream;
    }
}
