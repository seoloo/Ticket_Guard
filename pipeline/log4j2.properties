# [홍석환] Spark 실행 로그 설정
# 콘솔 출력 형식과 로깅 수준을 지정해 처리 로그를 구성한다.
status = error
name = PipelineLogging
appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{ISO8601} %p %c{1}: %m%n
# Python code emits sanitized lifecycle messages. JVM exception messages can
# contain Kafka records or Spark worker environment, so don't print them.
rootLogger.level = OFF
rootLogger.appenderRef.console.ref = console
