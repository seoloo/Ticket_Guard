# 팀 입구(nginx) 연결 후 사용 · 밖으로 포트를 열지 않음 · AGENTS.md 4장
# 혼자 개발할 때는 ticket-guard-qa dashboard로 127.0.0.1:8800에서 직접 띄움
name: ticket-guard-qa

services:
  qa-dashboard:
    build: .
    expose:
      - "8800"  # 팀 네트워크 안쪽 전용
    env_file:
      - path: .env
        required: false
    environment:
      TICKET_GUARD_QA_DASHBOARD_HOST: 0.0.0.0
      TICKET_GUARD_QA_ADMIN_CHECK_MODE: gateway_header
      TICKET_GUARD_QA_DASHBOARD_BASE_PATH: /qa
      TICKET_GUARD_QA_SYSTEM_BASE_URL: ${TICKET_GUARD_QA_SYSTEM_BASE_URL:-http://web:8000}
      TICKET_GUARD_QA_QA_DATABASE_URL: sqlite:////qa/qa_data/qa.db
      TICKET_GUARD_QA_REPORT_OUTPUT_DIR: /qa/qa_data/reports
    volumes:
      - qa-data:/qa/qa_data
    networks:
      - team-network

networks:
  team-network:
    external: true
    name: ${TICKET_GUARD_TEAM_NETWORK:-ticket-guard_default}  # 팀 compose 네트워크 · 팀 입구와 같은 곳

volumes:
  qa-data:
