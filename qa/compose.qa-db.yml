# QA DB · PostgreSQL · 정답표 · 봇 설정 · Run 기록 · 팀 compose에 덧붙여 실행 · AGENTS.md 6장
# docker compose -f compose.yml -f compose.gateway.yml -f qa/compose.qa-db.yml up -d --build
# 내 PC에서 DB 도구로 볼 때만 -f qa/compose.qa-db.local.yml 추가 (127.0.0.1:15432)
# qa-backend 네트워크 = qa-dashboard · qa-postgres만 · web · Spark · raw consumer는 접근 못 함
services:
  qa-postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${QA_POSTGRES_DB:-ticketguard_qa}
      POSTGRES_USER: ${QA_POSTGRES_USER:-ticketguard_qa}
      POSTGRES_PASSWORD: ${QA_POSTGRES_PASSWORD:?Set QA_POSTGRES_PASSWORD in .env}
    networks: [qa-backend]
    volumes:
      - qa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  qa-dashboard:
    environment:
      # 비밀번호는 .env에만 · 영문 · 숫자만 (주소에 그대로 들어감)
      TICKET_GUARD_QA_QA_DATABASE_URL: postgresql+psycopg://${QA_POSTGRES_USER:-ticketguard_qa}:${QA_POSTGRES_PASSWORD:?Set QA_POSTGRES_PASSWORD in .env}@qa-postgres:5432/${QA_POSTGRES_DB:-ticketguard_qa}
    networks: [default, qa-backend]
    depends_on:
      qa-postgres:
        condition: service_healthy

networks:
  qa-backend:

volumes:
  qa-postgres-data:
